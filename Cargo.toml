[package]
name = "fa"
version = "0.1.0-beta.1"
edition = "2024"
description = "Recipe-based project scaffolder CLI for Debian and Termux"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
